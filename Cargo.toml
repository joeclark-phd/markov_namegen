[package]
name = "markov_namegen"
version = "0.7.0"
edition = "2021"
authors = ["joeclark-phd <joe@joeclark.net>"]
license = "MIT"
repository = "https://github.com/joeclark-phd/markov_namegen"
description = """
Random text generators based on Markov models.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
multimarkov = { version = "1.1.0" }
regex = { version = "1.8.1", default-features = false, features = ["std"] }
is-vowel = { version = "0.1.0", default-features = false }
rand = { version = "0.10", default-features = false }
log = { version = "0.4.22", default-features = false }

[dev-dependencies]
env_logger = { version = "0.11.5", default-features = false }
